version: "3.9"

# 生产/比赛部署拓扑（开发文档 §17.1）：
# Nginx → Web 静态站点 + FastAPI API → PostgreSQL / Redis / MinIO / Worker
# 本地开发无需 Docker：见 README「本地开发」。

services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://dhp:dhp@postgres:5432/dhp
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_PRIVATE: dhp-private
      S3_BUCKET_PUBLIC: dhp-public
      S3_ACCESS_KEY: dhp
      S3_SECRET_KEY: dhp-password
      REDIS_URL: redis://redis:6379/0
      JOB_RUNNER: inprocess
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PUBLIC_ORIGIN: http://localhost
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dhp
      POSTGRES_PASSWORD: dhp
      POSTGRES_DB: dhp
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dhp
      MINIO_ROOT_PASSWORD: dhp-password
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
