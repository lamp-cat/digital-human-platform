server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        client_max_body_size 120m;
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
    }

    location / {
        proxy_pass http://web:5173;
        proxy_set_header Host $host;
    }
}
